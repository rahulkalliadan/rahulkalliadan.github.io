title: "Rahul Kalliadan"          # keep for SEO
description: "Engineer — Robotics hardware, mechanisms, DFM/DFA, GD&T."
url: "https://rahulkalliadan.github.io"
baseurl: ""
timezone: "Asia/Kolkata"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"

# Hide the masthead title on the left so only (Experience, Blog) show on the right
masthead_title: ""

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

permalink: /:categories/:title/
paginate: 7
paginate_path: "/page:num/"

# Keep pages as a collection since we use _pages/experience.md
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true

author:
  name: "Rahul Kalliadan"
  avatar: "/assets/images/avatar.jpg"
  bio: "Mechanical Robotics Engineer — prototype to production."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rahulkalliadan"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rahulkalliadan"
