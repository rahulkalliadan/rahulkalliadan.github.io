title: "Rahul Kalliadan"
description: "Senior Mechanical Engineer (Robotics) — AMRs, mechanisms, DFM/DFA, GD&T."
url: "https://rahulkalliadan.github.io"
baseurl: ""
timezone: "Asia/Kolkata"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# No projects collection anymore
permalink: /:categories/:title/
paginate: 7
paginate_path: "/page:num/"

author:
  name: "Rahul Kalliadan"
  avatar: "/assets/images/avatar.png"
  bio: "Mechanical Robotics Engineer. Prototype → Production."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rahulkalliadan"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rahulkalliadan"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
