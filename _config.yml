title: "Rahul Kalliadan"
description: "Senior Mechanical Engineer (Robotics) — AMRs, mechanisms, DFM/DFA, GD&T."
url: "https://rahulkalliadan.github.io"
baseurl: ""
timezone: "Asia/Kolkata"

# Minimal Mistakes via remote theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# IMPORTANT: GitHub Pages must load these plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "single"
      author_profile: true

# URLs
permalink: /:categories/:title/
paginate: 5
paginate_path: "/blog/page:num/"
