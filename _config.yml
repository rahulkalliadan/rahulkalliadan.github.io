title: "Rahul Kalliadan"
description: "Engineer — Robotics hardware, mechanisms, DFM/DFA, GD&T."
url: "https://rahulkalliadan.github.io"
baseurl: ""
timezone: "Asia/Kolkata"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"
masthead_title: ""    # keep left brand empty; use right-side nav

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

permalink: /:categories/:title/
paginate: 7
paginate_path: "/page:num/"

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
