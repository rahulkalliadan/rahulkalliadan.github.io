{%- comment -%}
  HEAD custom:
  - Load Poppins
  - Load BOTH dark & light CSS and toggle by enabling/disabling
  - Persist theme in localStorage
{%- endcomment -%}

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link id="rk-theme-dark"  rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link id="rk-theme-light" rel="stylesheet" href="{{ '/assets/css/main-light.css' | relative_url }}">

<script>
(function () {
  var KEY   = 'rk-theme';
  var pref  = localStorage.getItem(KEY) || 'dark';   // default: dark
  var dark  = document.getElementById('rk-theme-dark');
  var light = document.getElementById('rk-theme-light');

  function apply(theme) {
    if (!dark || !light) return;
    if (theme === 'light') { dark.disabled = true;  light.disabled = false; }
    else                   { dark.disabled = false; light.disabled = true;  }
    document.documentElement.setAttribute('data-theme', theme);
  }

  apply(pref);
  window.__rkSetTheme = function (t) { localStorage.setItem(KEY, t); apply(t); };
})();
</script>

<!-- Set theme ASAP to avoid flash -->
<script>
(function () {
  var t = localStorage.getItem('rk-theme');
  if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme'); // dark = default
})();
</script>
