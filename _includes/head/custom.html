<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    // prefer saved theme, else system preference
    var saved = localStorage.getItem('rk-theme');
    var pref  = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

    // swap main.css <-> main-light.css early (no flash)
    var link = document.querySelector('link[rel="stylesheet"][href*="/assets/css/main"]');
    if (link) {
      var href = link.getAttribute('href');
      var target = (pref === 'light')
        ? href.replace(/main(-light)?\.css/, 'main-light.css')
        : href.replace(/main(-light)?\.css/, 'main.css');
      if (href !== target) link.setAttribute('href', target);
    }
    document.documentElement.setAttribute('data-theme', pref);

    // smooth scroll for in-page anchors
    document.documentElement.style.scrollBehavior = 'smooth';
  } catch (e) {}
})();
</script>
